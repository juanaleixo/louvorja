name: Release

on:
  push:
    tags:
      # Releases estáveis: vMAJOR.MINOR.PATCH (ex: v1.28.0)
      - 'v*.*.*'
      # Pre-releases: vMAJOR.MINOR.PATCH-IDENT (ex: v1.28.0-preview.1, v1.28.0-rc.1)
      - 'v*.*.*-*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: installer-windows
            artifact_glob: |
              dist_electron/*.exe
              dist_electron/*.blockmap
              dist_electron/latest.yml
          - os: macos-latest
            platform: mac
            artifact: installer-macos
            artifact_glob: |
              dist_electron/*.dmg
              dist_electron/*.zip
              dist_electron/*.blockmap
              dist_electron/latest-mac.yml
          - os: ubuntu-latest
            platform: linux
            artifact: installer-linux
            artifact_glob: |
              dist_electron/*.AppImage
              dist_electron/*.deb
              dist_electron/*.rpm
              dist_electron/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Habilitar long paths (Windows)
        if: matrix.platform == 'win'
        run: git config --global core.longpaths true

      # O electron-builder baixa o fpm bundled, mas para gerar .rpm ele delega
      # ao rpmbuild do sistema (e exige xz). O runner ubuntu-latest não traz
      # essas ferramentas por padrão — sem elas o job Linux falha.
      - name: Instalar ferramentas RPM
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils

      # Assinatura + notarização macOS — importa o Developer ID no keychain
      # do runner para o electron-builder (osx-sign) assinar sem prompt.
      - name: Importar certificado Apple (macOS)
        if: matrix.platform == 'mac'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: run0$j4ng$h4cker
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

      - name: Build Electron
        run: npm run electron:build:${{ matrix.platform }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          VITE_BASE_URL: /
          VITE_URL_DATABASE: ${{ vars.VITE_URL_DATABASE }}
          VITE_URL_FILES: ${{ vars.VITE_URL_FILES }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          # Assinatura/notarização macOS: usa o keychain importado acima.
          # Nos runners win/linux o certificado não existe → build sem assinatura.
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 7
          if-no-files-found: error

  publish:
    # Só publica quando o build foi disparado por uma tag — evita criar
    # release vazia em workflow_dispatch sem tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar artifacts dos 3 OSes
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Detectar pre-release
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=LouvorJA ${GITHUB_REF_NAME#v} (pré-visualização)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=LouvorJA ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Obter PR associado ao commit
        id: pr
        uses: actions-ecosystem/action-get-merged-pull-request@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar changelog
        id: changelog
        run: |
          # tornar o script tolerante a greps vazios
          set +e
          REPO="${GITHUB_REPOSITORY}"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          echo "" > changelog.md

          COMMITS=$(git log $RANGE --pretty=format:"%s%x09%H" --no-merges || true)

          # FEAT
          FEAT=$(printf '%s\n' "$COMMITS" | grep -E "^feat(\([^)]*\))?(!)?:" || true)
          if [ -n "$FEAT" ]; then
            echo "## ✨ Novidades" >> changelog.md
            printf '%s\n' "$FEAT" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG#feat*:}"
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          # FIX
          FIX=$(printf '%s\n' "$COMMITS" | grep -E "^fix(\([^)]*\))?(!)?:" || true)
          if [ -n "$FIX" ]; then
            echo "## 🐞 Correções" >> changelog.md
            printf '%s\n' "$FIX" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG#fix*:}"
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          # REFACTOR
          REFACTOR=$(printf '%s\n' "$COMMITS" | grep -E "^refactor(\([^)]*\))?(!)?:" || true)
          if [ -n "$REFACTOR" ]; then
            echo "## 🔧 Aprimoramentos" >> changelog.md
            printf '%s\n' "$REFACTOR" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG#refactor*:}"
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          # PERF
          PERF=$(printf '%s\n' "$COMMITS" | grep -E "^perf(\([^)]*\))?(!)?:" || true)
          if [ -n "$PERF" ]; then
            echo "## ⚡ Melhorias de performance" >> changelog.md
            printf '%s\n' "$PERF" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG#perf*:}"
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          # DOCS
          DOCS=$(printf '%s\n' "$COMMITS" | grep -E "^docs(\([^)]*\))?(!)?:" || true)
          if [ -n "$DOCS" ]; then
            echo "## 📝 Documentação" >> changelog.md
            printf '%s\n' "$DOCS" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG#docs*:}"
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          # TEST
          TEST=$(printf '%s\n' "$COMMITS" | grep -E "^test(\([^)]*\))?(!)?:" || true)
          if [ -n "$TEST" ]; then
            echo "## 🧪 Testes" >> changelog.md
            printf '%s\n' "$TEST" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG#test*:}"
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          # CHORE
          CHORE=$(printf '%s\n' "$COMMITS" | grep -E "^chore(\([^)]*\))?(!)?:" || true)
          if [ -n "$CHORE" ]; then
            echo "## 📦 Tarefas internas" >> changelog.md
            printf '%s\n' "$CHORE" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG#chore*:}"
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          # OUTRAS MUDANÇAS
          OTHER=$(printf '%s\n' "$COMMITS" | grep -vE "^(feat|fix|refactor|perf|docs|test|chore)(\([^)]*\))?(!)?:" || true)
          if [ -n "$OTHER" ]; then
            echo "## 🔹 Outras mudanças" >> changelog.md
            printf '%s\n' "$OTHER" | while IFS=$'	' read -r MSG HASH; do
              MSG="${MSG# }"
              echo "- $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done
            echo "" >> changelog.md
          fi

          CHANGELOG=$(cat changelog.md)
          if [ -z "$(echo "$CHANGELOG" | tr -d '[:space:]')" ]; then
            CHANGELOG="Nenhuma mudança encontrada."
          fi
          DELIM=$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
          echo "changelog<<$DELIM" >> $GITHUB_OUTPUT
          printf '%s\n' "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT
      
      

      - name: Montar texto final da release
        id: notes
        env:
          PR_BODY: ${{ steps.pr.outputs.body }}
          CHANGELOG_TEXT: ${{ steps.changelog.outputs.changelog }}
        run: |
          # tornar tolerante a comandos que retornam !=0
          set +e

          # ler variáveis de ambiente (já definidas pelo runner de forma segura)
          MAIN_TEXT="$PR_BODY"
          if [ -z "$MAIN_TEXT" ]; then
            MAIN_TEXT="$(git log -1 --pretty=format:%B)"
          fi

          # montar body final e enviar para GITHUB_OUTPUT preservando quebras de linha
          DELIM_BODY=$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
          {
            printf 'body<<%s\n' "$DELIM_BODY"
            printf '%s\n' "$MAIN_TEXT"
            printf '\n---\n\n# 🔥 Changelog \n\n'
            printf '%s\n' "$CHANGELOG_TEXT"
            printf '%s\n' "$DELIM_BODY"
          } >> "$GITHUB_OUTPUT"
      

      - name: Criar/atualizar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
