name: Release

on:
  push:
    tags:
      # Releases estáveis: vMAJOR.MINOR.PATCH (ex: v1.28.0)
      - 'v*.*.*'
      # Pre-releases: vMAJOR.MINOR.PATCH-IDENT (ex: v1.28.0-preview.1, v1.28.0-rc.1)
      - 'v*.*.*-*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: installer-windows
            artifact_glob: |
              dist_electron/*.exe
              dist_electron/*.blockmap
              dist_electron/latest.yml
          - os: macos-latest
            platform: mac
            artifact: installer-macos
            artifact_glob: |
              dist_electron/*.dmg
              dist_electron/*.zip
              dist_electron/*.blockmap
              dist_electron/latest-mac.yml
          - os: ubuntu-latest
            platform: linux
            artifact: installer-linux
            artifact_glob: |
              dist_electron/*.AppImage
              dist_electron/*.deb
              dist_electron/*.rpm
              dist_electron/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Habilitar long paths (Windows)
        if: matrix.platform == 'win'
        run: git config --global core.longpaths true

      # O electron-builder baixa o fpm bundled, mas para gerar .rpm ele delega
      # ao rpmbuild do sistema (e exige xz). O runner ubuntu-latest não traz
      # essas ferramentas por padrão — sem elas o job Linux falha.
      - name: Instalar ferramentas RPM
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils

      - name: Build Electron
        run: npm run electron:build:${{ matrix.platform }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          VITE_BASE_URL: /
          VITE_URL_DATABASE: ${{ vars.VITE_URL_DATABASE }}
          VITE_URL_FILES: ${{ vars.VITE_URL_FILES }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          # Sem code signing automático no macOS — requer certificado pago
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 7
          if-no-files-found: error

  publish:
    # Só publica quando o build foi disparado por uma tag — evita criar
    # release vazia em workflow_dispatch sem tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar artifacts dos 3 OSes
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Detectar pre-release
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=LouvorJA ${GITHUB_REF_NAME#v} (pré-visualização)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=LouvorJA ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Obter PR associado ao commit
        id: pr
        uses: actions-ecosystem/action-get-merged-pull-request@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar changelog
        id: changelog
        run: |
          REPO="${GITHUB_REPOSITORY}"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          echo "" > changelog.md

          gerar_grupo() {
            PREFIX=$1
            HEADER=$2
            EMOJI=$3

            COMMITS=$(git log $RANGE --pretty=format:"%s|%H" --no-merges | grep "^$PREFIX:")
            if [ -n "$COMMITS" ]; then
              echo "## $EMOJI $HEADER" >> changelog.md
              while IFS="|" read -r MSG HASH; do
                echo "- $EMOJI ${MSG#"$PREFIX:"} ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
              done <<< "$COMMITS"
              echo "" >> changelog.md
            fi
          }

          gerar_grupo "feat" "Novidades" "✨"
          gerar_grupo "fix" "Correções" "🐛"
          gerar_grupo "refactor" "Aprimoramentos" "🔧"
          gerar_grupo "perf" "Melhorias de performance" "⚡"
          gerar_grupo "docs" "Documentação" "📝"
          gerar_grupo "test" "Testes" "🧪"
          gerar_grupo "chore" "Tarefas internas" "📦"

          OTHER=$(git log $RANGE --pretty=format:"%s|%H" --no-merges | grep -vE "^(feat|fix|refactor|perf|docs|test|chore):")
          if [ -n "$OTHER" ]; then
            echo "## 🔹 Outras mudanças" >> changelog.md
            while IFS="|" read -r MSG HASH; do
              echo "- 🔹 $MSG ([ver commit](https://github.com/$REPO/commit/$HASH))" >> changelog.md
            done <<< "$OTHER"
            echo "" >> changelog.md
          fi

          CHANGELOG=$(cat changelog.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Montar texto final da release
        id: notes
        run: |
          if [ -n "${{ steps.pr.outputs.body }}" ]; then
            MAIN_TEXT="${{ steps.pr.outputs.body }}"
          else
            MAIN_TEXT=$(git log -1 --pretty=format:"%s%n%n%b")
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$MAIN_TEXT" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "# 🔥 Changelog automático" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "${{ steps.changelog.outputs.changelog }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Criar/atualizar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
